<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image to PDF</title>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--bd:#e3e6ea;--er:#d93025}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--ac:#5b9bff;--bd:#2b323b}}
*{box-sizing:border-box}
body{margin:0 auto;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px 16px 40px;max-width:720px}
h1{font-size:1.25rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.85rem;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button,label.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;cursor:pointer;font-family:inherit}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--er)}
button:disabled{opacity:.4}
input[type=file]{display:none}
select{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;font-family:inherit}
.prog{display:none;margin:12px 0 4px}
.prog.on{display:block}
.track{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ac);transition:width .2s}
#st{color:var(--mut);margin:8px 0;font-size:.9rem;min-height:1.3em}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--bd);flex:none;color:transparent;font-size:0}
.item .n{flex:1;min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n small{display:block;color:var(--mut)}
.item button{padding:8px 10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:.9rem}
.empty{color:var(--mut);text-align:center;padding:30px}
</style>
</head>
<body>
<h1>Image to PDF</h1>
<p class="sub">Pick photos, set the order, get one PDF. Works offline.</p>

<div class="bar">
  <label class="btn">Add images<input id="f" type="file" accept="image/*" multiple></label>
  <button class="sec" id="rev" disabled>⇅ Reverse</button>
  <button class="sec" id="clr" disabled>Clear</button>
</div>

<div class="bar">
  <select id="size">
    <option value="a4">A4 page</option>
    <option value="letter">Letter page</option>
    <option value="fit">Fit to image</option>
  </select>
  <select id="qual">
    <option value="auto">Quality: Auto</option>
    <option value="high">Quality: High</option>
    <option value="small">Quality: Small file</option>
  </select>
</div>

<div class="bar">
  <button id="mk" disabled>Create PDF</button>
  <button class="danger" id="cancel" style="display:none">Cancel</button>
</div>

<div class="prog" id="prog"><div class="track"><div class="fill" id="fill"></div></div></div>
<div id="st"></div>
<div class="list" id="list"><div class="empty">No images yet. Tap “Add images”.</div></div>

<script>
const $ = id => document.getElementById(id);

// Page images are downscaled before they go into the PDF. A phone photo is
// 12-48 MP; at 1240 px long edge an A4 page is still ~150 DPI, and each page
// costs a few hundred KB instead of tens of MB.
const MAX_EDGE = 1240;    // High quality
const SMALL_EDGE = 900;   // Small file / big batches
const BIG_BATCH = 120;    // auto-switch to the smaller setting above this
const CHUNK = 3 * 131072; // bytes per write, a multiple of 3 (see savePdf)

let items = [];           // [{ file, thumb }]
let running = false;
let cancelled = false;

const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------------- selection ---------------- */

$('f').addEventListener('change', e => {
  if (running) return;
  const files = Array.from(e.target.files || []);
  for (const file of files) items.push({ file, thumb: null });
  e.target.value = '';
  render();
});

$('rev').onclick = () => { if (running) return; items.reverse(); render(); };
$('clr').onclick = () => { if (running) return; items = []; render(); };

/* ---------------- thumbnails ----------------
   The old build kept a full-size object URL per image and rendered every one
   of them in the list, so picking 300 photos decoded 300 full-resolution
   bitmaps at once and the WebView was killed. Now only the rows on screen are
   decoded, and only down to 128 px. */

const io = ('IntersectionObserver' in window)
  ? new IntersectionObserver(entries => {
      for (const en of entries) {
        if (en.isIntersecting) { io.unobserve(en.target); fillThumb(en.target); }
      }
    }, { rootMargin: '300px' })
  : null;

function decode(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Unreadable image')); };
    img.src = url;
  });
}

async function fillThumb(el) {
  const it = items[+el.dataset.i];
  if (!it) return;
  if (it.thumb) { el.src = it.thumb; return; }
  try {
    const { img, url } = await decode(it.file);
    const s = Math.min(1, 128 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s));
    const h = Math.max(1, Math.round(img.naturalHeight * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    it.thumb = c.toDataURL('image/jpeg', 0.6);
    c.width = c.height = 0;
    img.src = '';
    URL.revokeObjectURL(url);
    el.src = it.thumb;
  } catch (_) {
    el.style.visibility = 'hidden';
  }
}

/* ---------------- list ---------------- */

function render() {
  const list = $('list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty">No images yet. Tap “Add images”.</div>';
  }
  const frag = document.createDocumentFragment();
  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'item';

    const im = document.createElement('img');
    im.alt = '';
    im.dataset.i = i;
    if (it.thumb) im.src = it.thumb;
    else if (io) io.observe(im);
    else fillThumb(im);
    row.appendChild(im);

    const name = document.createElement('div');
    name.className = 'n';
    name.textContent = (i + 1) + '. ' + it.file.name;
    const sz = document.createElement('small');
    sz.textContent = Math.max(1, Math.round(it.file.size / 1024)) + ' KB';
    name.appendChild(sz);
    row.appendChild(name);

    [['↑', () => mv(i, -1)], ['↓', () => mv(i, 1)], ['✕', () => rm(i)]].forEach(([t, fn]) => {
      const b = document.createElement('button');
      b.textContent = t;
      b.onclick = fn;
      row.appendChild(b);
    });
    frag.appendChild(row);
  });
  list.appendChild(frag);

  const n = items.length;
  $('rev').disabled = n < 2 || running;
  $('clr').disabled = !n || running;
  $('mk').disabled = !n || running;

  if (running) return;
  if (n > 1) $('st').textContent = n + ' images selected' + (n > 300 ? ' — large batch, “Small file” quality is recommended' : '');
  else if (n === 1) $('st').textContent = '1 image selected';
  else $('st').textContent = '';
}

function mv(i, d) {
  if (running) return;
  const j = i + d;
  if (j < 0 || j >= items.length) return;
  const t = items[i]; items[i] = items[j]; items[j] = t;
  render();
}

function rm(i) {
  if (running) return;
  items.splice(i, 1);
  render();
}

/* ---------------- pdf building ---------------- */

function setProgress(done, total, label) {
  $('prog').classList.add('on');
  $('fill').style.width = total ? Math.round((done / total) * 100) + '%' : '0%';
  $('st').textContent = label;
}

// One image at a time: decode, shrink onto a canvas, hand the JPEG to jsPDF,
// then drop every reference so the bitmap can be collected before the next one.
async function pageImage(file, maxEdge, quality) {
  const { img, url } = await decode(file);
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  if (!w0 || !h0) { URL.revokeObjectURL(url); throw new Error('Unreadable image'); }

  const s = Math.min(1, maxEdge / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * s));
  const h = Math.max(1, Math.round(h0 * s));

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { alpha: false });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);

  const data = c.toDataURL('image/jpeg', quality);

  c.width = c.height = 0;
  img.src = '';
  URL.revokeObjectURL(url);
  return { data, w, h };
}

// Writing the PDF used to mean one enormous base64 string of the whole file.
// Instead the bytes go out in ~400 KB pieces: writeFile for the first, then
// appendFile. Each piece is a multiple of 3 bytes so its base64 decodes to
// exactly the original bytes and the pieces join back up byte for byte.
function bytesToBase64(bytes) {
  let s = '';
  const step = 0x8000;
  for (let i = 0; i < bytes.length; i += step) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
  }
  return btoa(s);
}

async function savePdf(pdf, name, P) {
  const bytes = new Uint8Array(pdf.output('arraybuffer'));
  let first = true;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    const slice = bytes.subarray(i, Math.min(i + CHUNK, bytes.length));
    const b64 = bytesToBase64(slice);
    if (first) {
      await P.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
      first = false;
    } else {
      await P.Filesystem.appendFile({ path: name, data: b64, directory: 'CACHE' });
    }
    await tick();
  }
}

$('cancel').onclick = () => { cancelled = true; $('st').textContent = 'Cancelling…'; };

$('mk').onclick = async () => {
  if (running || !items.length) return;
  const { jsPDF } = window.jspdf;

  const mode = $('size').value;
  const qual = $('qual').value;
  const useSmall = qual === 'small' || (qual === 'auto' && items.length > BIG_BATCH);
  const maxEdge = useSmall ? SMALL_EDGE : MAX_EDGE;
  const quality = useSmall ? 0.62 : 0.72;

  running = true;
  cancelled = false;
  $('mk').disabled = true;
  $('rev').disabled = true;
  $('clr').disabled = true;
  $('cancel').style.display = '';
  $('fill').style.width = '0%';

  let pdf = null;
  let added = 0;
  let failed = 0;

  try {
    for (let i = 0; i < items.length; i++) {
      if (cancelled) throw new Error('Cancelled');
      setProgress(i, items.length, 'Processing image ' + (i + 1) + ' of ' + items.length);

      let pg;
      try {
        pg = await pageImage(items[i].file, maxEdge, quality);
      } catch (_) {
        failed++;                       // skip one bad file, keep going
        await tick();
        continue;
      }

      const orient = pg.w > pg.h ? 'l' : 'p';

      if (mode === 'fit') {
        if (!pdf) pdf = new jsPDF({ orientation: orient, unit: 'px', format: [pg.w, pg.h], hotfixes: ['px_scaling'], compress: true });
        else pdf.addPage([pg.w, pg.h], orient);
        pdf.addImage(pg.data, 'JPEG', 0, 0, pg.w, pg.h, undefined, 'FAST');
      } else {
        if (!pdf) pdf = new jsPDF({ orientation: orient, unit: 'mm', format: mode, compress: true });
        else pdf.addPage(mode, orient);
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const m = 8;
        const r = Math.min((pw - 2 * m) / pg.w, (ph - 2 * m) / pg.h);
        const iw = pg.w * r, ih = pg.h * r;
        pdf.addImage(pg.data, 'JPEG', (pw - iw) / 2, (ph - ih) / 2, iw, ih, undefined, 'FAST');
      }

      pg = null;
      added++;
      await tick();                     // let the progress bar paint
    }

    if (cancelled) throw new Error('Cancelled');
    if (!pdf || !added) throw new Error('No readable images' + (failed ? ' (' + failed + ' skipped)' : ''));

    setProgress(items.length, items.length, 'Saving PDF…');
    await tick();

    const name = 'images-' + Date.now() + '.pdf';
    const P = window.Capacitor && window.Capacitor.Plugins;

    if (P && P.Filesystem) {
      await savePdf(pdf, name, P);
      pdf = null;

      if (P.Share) {
        const uri = await P.Filesystem.getUri({ path: name, directory: 'CACHE' });
        await P.Share.share({ title: name, url: (uri && uri.uri) || uri, dialogTitle: 'Save or share PDF' });
      }
      $('fill').style.width = '100%';
      $('st').textContent = 'Done — ' + added + ' pages' + (failed ? ', ' + failed + ' skipped' : '') + '.';
    } else {
      pdf.save(name);
      pdf = null;
      $('fill').style.width = '100%';
      $('st').textContent = 'Done — ' + added + ' pages' + (failed ? ', ' + failed + ' skipped' : '') + '.';
    }
  } catch (err) {
    $('fill').style.width = '0%';
    $('st').textContent = err.message === 'Cancelled' ? 'Cancelled.' : 'Error: ' + err.message;
  } finally {
    pdf = null;
    running = false;
    cancelled = false;
    $('cancel').style.display = 'none';
    $('prog').classList.remove('on');
    $('rev').disabled = items.length < 2;
    $('clr').disabled = !items.length;
    $('mk').disabled = !items.length;
  }
};

render();
</script>
</body>
</html>
