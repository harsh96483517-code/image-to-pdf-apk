<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to PDF Maker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#eef0f3;--mut:#9aa3af;--ac:#5b9bff;--bd:#2b323b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:720px;margin:auto}
h1{font-size:1.3rem;margin:4px 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,label.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
input[type=file]{display:none}
select{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--bd)}
.item .n{flex:1;min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n small{display:block;color:var(--mut)}
.item button{padding:8px 10px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.empty{color:var(--mut);text-align:center;padding:30px}
#st{color:var(--mut);margin:8px 0}
</style>
</head>
<body>
<h1>Image to PDF Maker</h1>
<div class="bar">
  <label class="btn">Choose from Gallery<input id="f" type="file" accept="image/*" multiple></label>
  <button class="sec" id="rev" disabled>⇅ Reverse order</button>
  <button class="sec" id="clr" disabled>Clear</button>
</div>
<div class="bar">
  <select id="size">
    <option value="a4">A4 page</option>
    <option value="letter">Letter page</option>
    <option value="fit">Fit to image size</option>
  </select>
  <select id="q">
    <option value="o" selected>Original quality (large file)</option>
    <option value="h">High (2400px)</option>
    <option value="m">Medium (1800px)</option>
    <option value="s">Small file</option>
  </select>
  <button id="mk" disabled>Create PDF</button>
</div>
<div id="st"></div>
<div class="list" id="list"></div>

<script>
const $=id=>document.getElementById(id);
const tick=()=>new Promise(r=>setTimeout(r,0));
const Q={o:[Infinity,.95],h:[2400,.9],m:[1800,.8],s:[1280,.7]};
let items=[],tq=[],tr=false;

async function bmp(file){
  try{return await createImageBitmap(file)}catch(e){
    const u=URL.createObjectURL(file);
    try{const im=new Image();im.src=u;await im.decode();return im}finally{URL.revokeObjectURL(u)}
  }
}
async function jpegInfo(file){
  if(file.type&&file.type!=='image/jpeg')return null;
  const b=new DataView(await file.slice(0,262144).arrayBuffer());
  if(b.byteLength<4||b.getUint16(0)!==0xFFD8)return null;
  let p=2,ori=1;
  while(p+4<=b.byteLength){
    if(b.getUint8(p)!==0xFF){p++;continue}
    const m=b.getUint8(p+1);
    if(m===0xFF){p++;continue}
    if(m===0xD8||(m>=0xD0&&m<=0xD7)||m===0x01){p+=2;continue}
    const len=b.getUint16(p+2);
    if(m===0xE1&&len>=16&&b.getUint32(p+4)===0x45786966){
      const t=p+10,le=b.getUint16(t)===0x4949;
      const g16=o=>b.getUint16(t+o,le),g32=o=>b.getUint32(t+o,le);
      const o=g32(4),n=g16(o);
      for(let k=0;k<n;k++){const e=o+2+12*k;if(g16(e)===0x0112){ori=g16(e+8);break}}
    }
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){
      if(m>0xC2)return null;
      const h=b.getUint16(p+5),w=b.getUint16(p+7),c=b.getUint8(p+9);
      if(!w||!h||(c!==1&&c!==3)||ori>1)return null;
      return {w,h,c};
    }
    p+=2+len;
  }
  return null;
}
const dim=b=>[b.naturalWidth||b.width,b.naturalHeight||b.height];

async function thumbs(){
  if(tr)return;tr=true;
  while(tq.length){
    const it=tq.shift();if(it.gone)continue;
    try{
      const bm=await bmp(it.file),[W,H]=dim(bm),s=120/Math.max(W,H);
      const c=document.createElement('canvas');c.width=Math.max(1,W*s|0);c.height=Math.max(1,H*s|0);
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      bm.close&&bm.close();
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));
      c.width=c.height=0;
      if(it.gone)continue;
      it.url=URL.createObjectURL(b);
      const im=it.el&&it.el.querySelector('img');if(im)im.src=it.url;
    }catch(e){}
    await tick();
  }
  tr=false;
}

$('f').addEventListener('change',e=>{
  for(const file of e.target.files){const it={file};items.push(it);tq.push(it)}
  e.target.value='';render();thumbs();
});
$('rev').onclick=()=>{items.reverse();render()};
$('q').onchange=()=>render();
$('clr').onclick=()=>{items.forEach(i=>{i.gone=1;i.url&&URL.revokeObjectURL(i.url)});items=[];tq=[];render()};

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const l=$('list');l.innerHTML='';
  if(!items.length)l.innerHTML='<div class="empty">No images yet. Tap “Choose from Gallery”.</div>';
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';it.el=d;
    d.innerHTML='<img alt="" '+(it.url?'src="'+it.url+'"':'')+'><div class="n">'+(i+1)+'. '+esc(it.file.name)+'<small>'+(it.file.size/1024|0)+' KB</small></div>';
    [['↑',()=>mv(i,-1)],['↓',()=>mv(i,1)],['✕',()=>rm(i)]].forEach(([t,fn])=>{
      const b=document.createElement('button');b.textContent=t;b.onclick=fn;d.appendChild(b);
    });
    l.appendChild(d);
  });
  ['rev','clr','mk'].forEach(k=>$(k).disabled=!items.length);
  if(items.length>150&&$('q').value==='o'&&!$('mk').disabled)
    $('st').textContent=items.length+' images at Original quality will make a very large PDF - pick High or Medium.';
  else if(items.length&&$('st').textContent.indexOf('very large PDF')>-1) $('st').textContent='';
}
function mv(i,d){const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render()}
function rm(i){const it=items[i];it.gone=1;it.url&&URL.revokeObjectURL(it.url);items.splice(i,1);render()}

async function save(pdf,name){
  const P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){
    const C=1572864;let uri;
    for(let o=0;o<pdf.size;o+=C){
      $('st').textContent='Saving… '+Math.min(100,Math.round(o/pdf.size*100))+'%';
      const b64=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.onerror=rej;f.readAsDataURL(pdf.slice(o,o+C))});
      if(o===0){const r=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});uri=r.uri}
      else await P.Filesystem.appendFile({path:name,data:b64,directory:'CACHE'});
    }
    await P.Share.share({title:name,url:uri,dialogTitle:'Save / Share PDF'});
  }else{
    const a=document.createElement('a');a.href=URL.createObjectURL(pdf);a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  }
}

$('mk').onclick=async()=>{
  const [mx,q]=Q[$('q').value],mode=$('size').value;
  $('mk').disabled=true;
  const parts=[],offs=[];let pos=0,n=0,skipped=0;
  const add=s=>{parts.push(s);pos+=(s instanceof Blob)?s.size:s.length};
  add('%PDF-1.4\n');
  offs[1]=pos;add('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  try{
    for(let i=0;i<items.length;i++){
      $('st').textContent='Processing '+(i+1)+' / '+items.length+'…';
      let blob,w,h,csp='DeviceRGB',ji=null;
      if(mx===Infinity)ji=await jpegInfo(items[i].file).catch(()=>null);
      if(ji){blob=items[i].file;w=ji.w;h=ji.h;csp=ji.c===1?'DeviceGray':'DeviceRGB'}
      else try{
        const bm=await bmp(items[i].file),[W,H]=dim(bm),s=Math.min(1,mx/Math.max(W,H));
        w=Math.max(1,Math.round(W*s));h=Math.max(1,Math.round(H*s));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bm,0,0,w,h);
        bm.close&&bm.close();
        blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
        c.width=c.height=0;
        if(!blob)throw 0;
      }catch(e){skipped++;continue}
      let pw,ph;
      if(mode==='fit'){pw=w*.75;ph=h*.75}
      else{[pw,ph]=mode==='a4'?[595.28,841.89]:[612,792];if(w>h)[pw,ph]=[ph,pw]}
      const m=mode==='fit'?0:24,r=Math.min((pw-2*m)/w,(ph-2*m)/h),iw=w*r,ih=h*r;
      const po=3+3*n,co=po+1,io=po+2;n++;
      offs[po]=pos;
      add(`${po} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}]/Resources<</XObject<</Im0 ${io} 0 R>>>>/Contents ${co} 0 R>>\nendobj\n`);
      const cs=`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${((pw-iw)/2).toFixed(2)} ${((ph-ih)/2).toFixed(2)} cm /Im0 Do Q`;
      offs[co]=pos;add(`${co} 0 obj\n<</Length ${cs.length}>>\nstream\n${cs}\nendstream\nendobj\n`);
      offs[io]=pos;add(`${io} 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/${csp}/BitsPerComponent 8/Filter/DCTDecode/Length ${blob.size}>>\nstream\n`);
      add(blob);add('\nendstream\nendobj\n');
      await tick();
    }
    if(!n)throw new Error('No readable images (HEIC? use JPEG/PNG)');
    const kids=[];for(let k=0;k<n;k++)kids.push((3+3*k)+' 0 R');
    offs[2]=pos;add(`2 0 obj\n<</Type/Pages/Count ${n}/Kids[${kids.join(' ')}]>>\nendobj\n`);
    const N=3+3*n,xr=pos;
    let x=`xref\n0 ${N}\n0000000000 65535 f \n`;
    for(let k=1;k<N;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
    x+=`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
    add(x);
    const pdf=new Blob(parts,{type:'application/pdf'});
    await save(pdf,'images-'+Date.now()+'.pdf');
    $('st').textContent='Done! '+n+' pages, '+(pdf.size/1048576).toFixed(1)+' MB'+(skipped?' ('+skipped+' skipped)':'');
  }catch(err){
    $('st').textContent='Error: '+err.message;
  }
  $('mk').disabled=!items.length;
};
render();
</script>
</body>
</html>
